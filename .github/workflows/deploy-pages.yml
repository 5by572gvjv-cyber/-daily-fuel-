name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# pages: write + id-token: write 用于 Pages 部署；actions: read 用于读取本次运行的 github-pages 产物。
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: dist
      # 部署前确认产物确实挂在本次运行上，失败时可直接判断问题出在上传还是部署环节。
      - name: Verify pages artifact
        run: |
          curl -sS \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            | node -e "let raw='';process.stdin.on('data',c=>raw+=c).on('end',()=>{const data=JSON.parse(raw);const names=(data.artifacts||[]).map(a=>a.name);console.log('artifacts:',names.join(',')||'(none)');if(!names.includes('github-pages')){console.error('github-pages artifact missing');process.exit(1)}})"
      # Pages 的产物索引有短暂延迟：刚上传完立刻部署偶发「Found 0 artifact(s)」。留出稳定窗口再部署。
      - name: Wait for artifact indexing
        run: sleep 20
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
      # 首次部署被索引延迟拒绝时，再等一轮重试一次；两次都失败才算真失败。
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
