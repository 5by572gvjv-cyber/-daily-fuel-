name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# pages: write + id-token: write 用于 Pages 部署；actions: read 用于读取本次运行的 github-pages 产物。
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment-1.outputs.page_url || steps.deployment-2.outputs.page_url || steps.deployment-3.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: dist
      # Pages 的产物索引在上传完成后还会异步刷新一小会儿，立刻部署会偶发
      # "No artifacts named github-pages were found"。
      # 不在部署前做产物校验（校验自己也会撞上这个延迟），改为失败后按间隔重试。
      - name: Wait for artifact indexing
        run: sleep 25
      - id: deployment-1
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
      - name: Wait before retry 1
        if: steps.deployment-1.outcome == 'failure'
        run: sleep 45
      - id: deployment-2
        if: steps.deployment-1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
      - name: Wait before retry 2
        if: steps.deployment-1.outcome == 'failure' && steps.deployment-2.outcome == 'failure'
        run: sleep 60
      - id: deployment-3
        if: steps.deployment-1.outcome == 'failure' && steps.deployment-2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
      - name: Report deploy failure
        if: steps.deployment-3.outcome == 'failure'
        run: |
          echo "三次尝试都未部署成功，请查看上面 deploy-pages 步骤的日志。"
          exit 1
